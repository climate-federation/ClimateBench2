[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climatebench2"
version = "0.1.0"
description = "ClimateBench v2 — the protocol layer (thresholds, probabilistic scoring, leaderboard) on top of ClimateEval"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    { name = "Duncan Watson-Parris", email = "dwatsonparris@ucsd.edu" },
]
# ClimateEval is pre-1.0 (0.0.1) and not on PyPI: pin to a known-good commit and
# bump deliberately (see docs/climateeval_delineation_plan.md §8.4).
# For local development against a checkout instead:
#   pip install -e ../ClimateEval && pip install -e . --no-deps
dependencies = [
    # d2559b2 (2026-10-22) — ClimateEval main with every upstream PR the shipped
    # suites need merged (sea-ice extent, Nino34 window, staged-file timerange
    # filter, coordinate reconciliation, parabolic MHT peak, the CMIP6
    # generators). Same pixi.lock as the commit behind the paper's results
    # (33e45db); no Tier I gate value or Tier II raw_output differs (audited
    # 2026-10-27). deploy/Dockerfile's CLIMATEEVAL_REF must match.
    "climateeval @ git+https://github.com/climate-federation/ClimateEval.git@d2559b2fb1f70f37b84d41a281f81e79db754aba",
    "pyyaml",
]

[project.scripts]
climatebench2 = "climatebench2._cli:main"

[tool.setuptools.packages.find]
# Only the package. `paleo_scripts/` (the Tier III data-preparation pipeline),
# `analysis/` (standalone studies behind the paper figures) and `tests/` are
# deliberately not installable. The legacy top-level modules this filter was
# originally written against (constants.py, utils.py, benchmark_scrips/) were
# deleted in work package 7.
include = ["climatebench2*"]

[tool.setuptools.package-data]
# thresholds.yml — every protocol bound; suites/*.yml — the suite definitions;
# data/*.csv — packaged protocol data tables (the ERF series driving the
# pattern-scaling baseline's EBM).
climatebench2 = ["thresholds.yml", "suites/*.yml", "data/*.csv"]
