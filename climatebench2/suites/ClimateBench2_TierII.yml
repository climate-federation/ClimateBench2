# ClimateBench v2 — Tier II: scoring against observations.
# Core protocol variables (metrics_reference.md Tier II): tas, pr, TOA
# fluxes, SST, sea ice, OHC, prw, clouds — evaluated with ClimateEval diagnostics
# against the protocol's observational references, with the CMIP6
# historical+SSP2-4.5 ensemble carried along as comparison (the MME baseline of
# the protocol, and the E_ref median of every score here). That ensemble is
# `climatebench2.data.StagedCMIP6HistoricalSSP245` — several members per model,
# enumerated in the staged data root; its module docstring says why it exists
# next to the equivalent upstream `climateeval.data.CMIP6HistoricalSSP245`.
#
# Scoring happens in the post-suite pass (climatebench2.scoring_pass), not in
# the diagnostics: the members of one model arrive as separate data sources,
# so a fair CRPS can only be formed after every member has run. This suite's
# job is to put the right series and fields in the database.
#
# The suite is cut to the reserved post-2015 test window (_cli.SUITE_REGISTRY),
# which also cuts the *reference* -- but the cut is applied PER ENTRY
# (climatebench2.reference_windows.apply_reference_windows), because the
# entries do not all want the same window:
#
#   * the SCORED TIME SERIES (annual_mean_timeseries, sst, ohc,
#     sea_ice_minimum -- the entries listed under `tier2.anomaly_baseline`)
#     are loaded from 1985, the first year of the baseline window. Regime (a)
#     scores ANOMALIES about each source's own 1985-2014 climatology -- of the
#     submission, of the reference and of every `other_data` comparison member
#     alike -- so the climatology has to be in the cube. The scoring pass
#     computes the anomaly per `data_id` (i.e. per ensemble member) and then
#     keeps only the post-2015 steps, so what is SCORED is still the test
#     window; a source that does not reach far enough into the baseline
#     window is left unscored with a reason, never scored on absolute values.
#   * every other entry (annual_cycle, map, zonal_line, eof_projection,
#     sea_ice_annual_cycle, and the sst_* equivalents) keeps the nominal test
#     window: their statistic IS the test-window field, and a longer cube
#     would silently redefine it.
#
# Two entries deliberately reach back past that cut on their own, through
# their own copy of the variable's timerange:
#   reference_baseline  the reference's 1985-2014 area-mean series, from which
#                       the pass builds the Climatology baseline's pseudo-
#                       members (without it there is no no-skill floor);
#   eof_projection      the regime-(b) basis — the reference's fixed pre-2015
#                       EOFs — and every source's test-window climatological
#                       anomaly projected onto it, standardised by the
#                       pre-2015 PC sigma.
# The regime-(c) trend consistency is no longer a diagnostic: the pass takes
# the trends from `annual_mean_timeseries` and combines the ensemble spread
# with the piControl sigma_int (Tier I suite) and sigma_obs.
#
# Skin temperature `ts` is NOT scored (Duncan, 2026-10-27, v2 protocol): its only
# staged reference was MERRA-2, a reanalysis stand-in ending 2021, and it was
# already left out of the published Fig. 4. Model `ts` remains a Tier I input.
#
# The 2026-09-24 figure set (Duncan) was tas, ts, pr, rsut, rlut, rsutcs,
# rlutcs, swcre, lwcre, tos, siconc, clt, clwvi, clivi; ts is gone since
# 2026-10-27, as above. The clouds were
# OUT of it until then: their only reference was ESACCI-CLOUD, which ends in
# 2016, so their scored window was two years of the test window and the fair
# CRPS fell below the scoring pass's minimum overlap. They are now referenced
# to MODIS Aqua (climatebench2.data.MODIS, 2002-07 onwards), which covers the
# whole test window; because MODIS starts mid-2002, their regime-(a) anomaly
# baseline is 2003-2014 (12 of the 30 baseline years, above
# `tier2.anomaly_baseline.min_years`), exactly as the CERES-EBAF fluxes'
# is 2001-2014. The cloud-radiative effects swcre/lwcre are derived from the
# CERES-EBAF all-sky and clear-sky fluxes, the only post-2015 cloud-radiative
# reference.

- name: annual_mean_timeseries
  diagnostic: climatebench2.diags.ScoredAnnualMeanTimeSeries
  variables: &core_variables
    - id: tas
      var_name: tas
      frequency: mon
      reference_data: climateeval.data.HadCRUT5
      other_data: &comparison_ensemble
        # The CMIP6 comparison ensemble that E_ref is the median over
        # (metrics_reference.md II.0). Historical+SSP2-4.5, several members per
        # model, discovered in the staged data root -- see
        # climatebench2/data/cmip6_staged.py for why this and not upstream's
        # pool-globbing climateeval.data.CMIP6HistoricalSSP245 (identical ids).
        - climatebench2.data.StagedCMIP6HistoricalSSP245
    - id: pr
      var_name: pr
      frequency: mon
      units: mm day-1
      reference_data: climateeval.data.GPCP
      other_data: *comparison_ensemble
    - id: rsut
      var_name: rsut
      frequency: mon
      reference_data: climateeval.data.CERESEBAF
      other_data: *comparison_ensemble
    - id: rlut
      var_name: rlut
      frequency: mon
      reference_data: climateeval.data.CERESEBAF
      other_data: *comparison_ensemble
    # Derived (rsdt - rsut - rlut), so a comparison member needs all three —
    # `DataSource.get_cube` derives it from the staged rsdt/rsut/rlut of that
    # member and yields nothing for a member that is missing one of them.
    - id: rtnt
      var_name: rtnt
      frequency: mon
      reference_data: climateeval.data.CERESEBAF
      other_data: *comparison_ensemble
    # Clear-sky TOA (paper Tier II core: "TOA fluxes, all- AND clear-sky").
    # CERES-EBAF carries both; separating clear-sky from all-sky is what
    # isolates the cloud-radiative contribution to a flux error.
    - id: rsutcs
      var_name: rsutcs
      frequency: mon
      reference_data: climateeval.data.CERESEBAF
      other_data: *comparison_ensemble
    - id: rlutcs
      var_name: rlutcs
      frequency: mon
      reference_data: climateeval.data.CERESEBAF
      other_data: *comparison_ensemble
    # Cloud-radiative effects, derived (ESMValCore): swcre = rsutcs - rsut,
    # lwcre = rlutcs - rlut, both positive down (swcre < 0 cools, lwcre > 0
    # warms). Like `rtnt`, neither is staged under its own name: CERES-EBAF
    # derives them from its staged fluxes, and a comparison member needs BOTH
    # the all-sky and the clear-sky flux staged or it is not yielded for the
    # variable (StagedCMIP6HistoricalSSP245._required_var_names). The paper's
    # "clouds" item has no post-2015 reference other than these and MODIS.
    - id: swcre
      var_name: swcre
      frequency: mon
      reference_data: climateeval.data.CERESEBAF
      other_data: *comparison_ensemble
    - id: lwcre
      var_name: lwcre
      frequency: mon
      reference_data: climateeval.data.CERESEBAF
      other_data: *comparison_ensemble
    - id: prw
      var_name: prw
      frequency: mon
      reference_data: climateeval.data.ERA5Monthly
      other_data: *comparison_ensemble
    # Clouds: MODIS Aqua MYD08_M3 (staged; climatebench2/data/modis.py), not
    # ESACCI-CLOUD, which ends in 2016 -- two years into the test window.
    # MODIS starts 2002-07, so the regime-(a) anomaly baseline is 2003-2014.
    - id: clt
      var_name: clt
      frequency: mon
      reference_data: climatebench2.data.MODIS
      other_data: *comparison_ensemble
    # Condensed-water paths (paper Tier II extended: "cloud properties —
    # LWP, fraction"), grid-box means as in ESMValTool's modis.ncl (MODIS
    # retrieves IN-CLOUD paths; the staging converts them). MODIS also stages
    # `lwp` (= clwvi - clivi), which is not scored here: it is the difference
    # of the two columns below and adds no independent information.
    # Cloud-top temperature/pressure remain missing (no DataSource).
    - id: clwvi
      var_name: clwvi
      frequency: mon
      reference_data: climatebench2.data.MODIS
      other_data: *comparison_ensemble
    - id: clivi
      var_name: clivi
      frequency: mon
      reference_data: climatebench2.data.MODIS
      other_data: *comparison_ensemble

- name: reference_baseline
  diagnostic: climatebench2.diags.ReferenceBaselineRecord
  variables: *core_variables

- name: annual_cycle
  diagnostic: climateeval.diags.simple.AnnualCycle
  variables: *core_variables

- name: map
  diagnostic: climateeval.diags.simple.Map
  variables: *core_variables

- name: eof_projection
  diagnostic: climatebench2.diags.ReferenceEOFProjection
  variables: *core_variables

- name: zonal_line
  diagnostic: climateeval.diags.simple.ZonalLine
  variables: *core_variables

# --- Ocean -----------------------------------------------------------------
#
# The SST reference is EN4 (climateeval.data.EN4), not ESACCI-SST: EN4 is what
# is staged in ClimateEval form for this evaluation, ESACCI-SST is not, and a
# reference that does not resolve leaves every sst* row unscored. EN4's `tos`
# is the objective analysis' surface level, so it is an SST *analysis* rather
# than a satellite retrieval — the protocol names ESACCI-SST
# (metrics_reference.md Tier II), so swap the reference back the day it is
# staged. HadISST and NOAA-ERSSTv5 would be the natural second observational
# estimates (the sigma_obs spread term), but neither has `tos` in the staged
# root (HadISST is staged for `siconc` only), so both are dropped rather than
# left to log a missing-data warning per member per diagnostic.

- name: sst
  diagnostic: climatebench2.diags.ScoredAnnualMeanTimeSeries
  variables:
    - &tos
      id: tos
      var_name: tos
      frequency: mon
      reference_data: climateeval.data.EN4
      other_data: *comparison_ensemble

- name: sst_baseline
  diagnostic: climatebench2.diags.ReferenceBaselineRecord
  variables:
    - *tos

- name: sst_map
  diagnostic: climateeval.diags.simple.Map
  variables:
    - *tos

- name: sst_eof_projection
  diagnostic: climatebench2.diags.ReferenceEOFProjection
  variables:
    - *tos

- name: ohc
  # Ocean heat content of the full column and of the 0-2000 m and 0-100 m
  # layers (paper Table 2: annual, Extended), regime (a): the annual global
  # series in ZJ, scored as anomalies about each source's own 1985-2014 mean.
  #
  # INPUT IS `thetao` (what a submission uploads), not a staged `phcint`:
  # `climatebench2.data.layer_heat_content` turns it into the layer's heat
  # content per unit area on load (ESMValCore main's phcint: thetao[K] x
  # rho0*cp x thickness, the layer cut exactly at z_max, summed over depth on
  # the source's own grid), so the submission, both references and every
  # comparison member go through the same code and nothing is materialised.
  # The layer bounds are protocol: they are recorded in each database's
  # `variables` row, which the frozen-comparison merge checks.
  #
  # Reference IAP (named by the paper; ends 2024-12, so the scored window is
  # 2015-2024), EN4 as the second observational product (to 2025-12; its
  # spread against IAP enters sigma_obs). The other way round, IAP would fail
  # ClimateEval's coverage check over EN4's 2015-2025 window and drop out.
  # The CMIP6 comparison ensemble (thetao staged for 100 members / 36 models)
  # is what E_ref is the median over, as for every scored variable.
  diagnostic: climatebench2.diags.ScoredOceanHeatContent
  variables:
    - &ohc
      id: phcint_total
      var_name: thetao
      frequency: mon
      units: J m-2
      reference_data: climateeval.data.IAP
      other_data:
        - climateeval.data.EN4
        - climatebench2.data.StagedCMIP6HistoricalSSP245
      additional_preprocessors:
        climatebench2.data.layer_heat_content:
          z_min: 0.0
          z_max: null
    - <<: *ohc
      id: phcint_2000m
      additional_preprocessors:
        climatebench2.data.layer_heat_content:
          z_min: 0.0
          z_max: 2000.0
    - <<: *ohc
      id: phcint_100m
      additional_preprocessors:
        climatebench2.data.layer_heat_content:
          z_min: 0.0
          z_max: 100.0

# --- Sea ice ---------------------------------------------------------------
#
# The protocol scores sea-ice EXTENT (sum of the area of every cell whose
# concentration reaches 15 %), not sea-ice area (sum of siconc x area) -- a
# different number, systematically larger and far less sensitive to a
# concentration bias. ClimateEval PR #47 added the extent diagnostics, so
# these stanzas now use them. There is NO `extent_threshold` diagnostic
# kwarg: the 15 % definition is the class default
# `SeaIceExtentTimeSeries._concentration_threshold`
# (`climateeval.diags.simple._sea_ice.SEA_ICE_EXTENT_THRESHOLD`); a suite that
# passes `extent_threshold:` would raise on an unexpected kwarg.
#
# Reference: HadISST, which is what is staged in ClimateEval form
# (`reanalysis_HadISST/mon/siconc`, ending 2021-12 -- so the scored window is
# the intersection of the test window with that record, not its full length).
# The protocol names OSI-450 / NSIDC-G02202; neither is staged, and a
# reference that does not resolve leaves every sea-ice row unscored, so the
# swap back is a one-line change once they are.

- name: sea_ice_annual_cycle
  diagnostic: climateeval.diags.simple.SeaIceExtentAnnualCycle
  variables:
    - id: siconc_nh_extent
      var_name: siconc
      frequency: mon
      min_lat: 30.0
      max_lat: 90.0
      reference_data: climateeval.data.HadISST
      other_data: *comparison_ensemble
    - id: siconc_sh_extent
      var_name: siconc
      frequency: mon
      min_lat: -90.0
      max_lat: -30.0
      reference_data: climateeval.data.HadISST
      other_data: *comparison_ensemble

- name: sea_ice_minimum
  diagnostic: climateeval.diags.simple.SeaIceExtentTimeSeries
  variables:
    # NH September / SH February seasonal minima (paper Tier II sea-ice items).
    - id: siconc_nh_sep_extent
      var_name: siconc
      frequency: mon
      min_lat: 30.0
      max_lat: 90.0
      additional_preprocessors:
        esmvalcore.preprocessor.extract_month:
          month: 9
      reference_data: climateeval.data.HadISST
      other_data: *comparison_ensemble
    - id: siconc_sh_feb_extent
      var_name: siconc
      frequency: mon
      min_lat: -90.0
      max_lat: -30.0
      additional_preprocessors:
        esmvalcore.preprocessor.extract_month:
          month: 2
      reference_data: climateeval.data.HadISST
      other_data: *comparison_ensemble
