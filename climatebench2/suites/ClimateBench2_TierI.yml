  additional_diagnostic_kwargs: {}

- name: precip_buoyancy               # I.3c — historical (pr + ta/hus), 1983-2014
  diagnostic: climatebench2.diags.PrecipBuoyancyGate
  additional_diagnostic_kwargs: {}

- name: land_ocean_warming            # I.6a — piControl + abrupt-4xCO2
  diagnostic: climatebench2.diags.LandOceanWarmingGate
  additional_diagnostic_kwargs: {}

- name: arctic_amplification          # I.6b — piControl + abrupt-4xCO2
  diagnostic: climatebench2.diags.ArcticAmplificationGate
  additional_diagnostic_kwargs: {}

- name: aerosol_forcing               # I.7 — piControl + abrupt-4xCO2 + hist-aer
  diagnostic: climatebench2.diags.AerosolForcingGate
  additional_diagnostic_kwargs: {}

- name: meridional_heat_transport     # I.8a — piControl
  diagnostic: climatebench2.diags.MeridionalHeatTransportGate
  additional_diagnostic_kwargs: {}

- name: itcz_efe                      # I.8b — historical (12-month climatology)
  diagnostic: climatebench2.diags.ITCZEFEGate
  additional_diagnostic_kwargs: {}

- name: bjerknes                      # extra — piControl
  diagnostic: climatebench2.diags.BjerknesGate
  additional_diagnostic_kwargs: {}

- name: cc_scaling                    # extra — piControl
  diagnostic: climatebench2.diags.CCScalingGate
  additional_diagnostic_kwargs: {}

- name: enso_teleconnections          # I.5c — piControl (tos, ta, pr)
  diagnostic: climatebench2.diags.ENSOTeleconnectionsGate
  additional_diagnostic_kwargs: {}

- name: geostrophic_balance           # I.3b — daily ua/zg (key: day)
  diagnostic: climatebench2.diags.GeostrophicBalanceGate
  additional_diagnostic_kwargs: {}

- name: mjo                           # I.5d — daily pr (key: day)
