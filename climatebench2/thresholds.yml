# ClimateBench v2 — protocol thresholds
#
# Single source of truth for every pass/fail bound and scoring parameter in the
# ClimateBench v2 protocol. Populated from docs/metrics_reference.md (the
# authoritative spec, keyed by its section numbers); CB2 diagnostics read their
# bounds from here and must never hard-code them.
#
# Entries are the paper-settled values; items marked TODO await protocol
# resolution (docs/metrics_reference.md tracks each one).
#
# `requirement:` tags the protocol standing of every gate block (paper §7.1):
#   required   — must be passed for the model to be scored (the entry ticket)
#   extended   — reported alongside and earns additional credit, but does NOT
#                gate entry (no CMIP6-archived model can supply the inputs)
#   extra      — code-only sanity check, not in the paper's Tier I list
#   diagnostic — a Tier II aggregated diagnostic whose sign flags are emitted
#                through the gate machinery; never part of the entry ticket
# Gate classes read the tag via `pass_fail.gate_requirement("tier1.<block>")`;
# the leaderboard groups the scorecard by it. A Required test may still be
# declared *not applicable* per submission (`score --not-applicable NAME`,
# e.g. I.3b for a model with no dynamical representation).
#
# `tier:` (I / II / III) says which tier the check belongs to, read by
# `pass_fail.gate_tier("tier3.<block>")` and carried on every gate row. The
# leaderboard groups the scorecard by (tier, requirement), so a check's
# position on the page follows the protocol rather than the suite it happens
# to run in — the mid-Holocene monsoon gate is Tier III Extended even though
# it is emitted through the same gate machinery as the Tier I checks.

version: 0

tier1:
  # I.1 Energy balance closure (piControl)
  energy_balance:
    tier: I
    requirement: required
    mean_toa_net_abs_max: 0.5          # W m-2, |mean(N)|. Duncan 2026-09-21: was 0.1;
                                       # CMIP6 control imbalances are O(0.1-1) (Hobbs et
                                       # al. 2016; Irving et al. 2021) and 0.5 keeps the
                                       # control below the observed EEI (Loeb et al. 2021)
    drift_10yr_running_abs_max: 0.02   # W m-2 / decade, drift of 10-yr running mean
    evaluation_years: 100              # both criteria use the LAST 100 yr of piControl
                                       # (>=500 yr requested; shorter records are used
                                       # whole, with the length noted via `n_years`)

  # I.2a Water budget closure
  water_budget:
    tier: I
    requirement: required
    p_minus_e_abs_max: 0.05            # mm day-1, absolute

  # I.2b Atmospheric energy budget
  atm_energy_budget:
    tier: I
    requirement: required
    residual_abs_max: 2.0              # W m-2, |Q_rad − (L·P + SHF)|

  # I.3a Clear-sky LW feedback (forced response, abrupt-4xCO2 vs piControl)
  # Redefined 2026-09-21 (Duncan, ratified): the paper's gridpoint regression
  # of monthly `historical` anomalies probes interannual variability, not the
  # forced/spatial relation Koll & Cronin (2018) describe; on CNRM-CM6-1 it
  # gave β = 0.71, far below the old [1.65, 2.75] window. Zhang, Jeevanjee &
  # Fueglistaler (2020, GRL, doi:10.1029/2020GL089235) find GCMs instead give
  # a robust *global-mean* clear-sky LW feedback ≈1.9 W m-2 K-1 in the forced
  # abrupt-4xCO2 response (locally negative over tropical oceans, compensated
  # globally). 2.2 (Koll & Cronin 2018) is the fixed-RH column value, which
  # GCMs undershoot; 1.9 is the GCM consensus this gate now targets.
  clear_sky_lw_feedback:
    tier: I
    requirement: required
    reference: 1.9                     # W m-2 K-1 (Zhang et al. 2020 GCM consensus)
    rel_tolerance: 0.25                # ±25% → [1.425, 2.375]
    n_years: 150                       # yr of abrupt-4xCO2 used (whole record if shorter)

  # I.3b Midlatitude geostrophic balance (daily 850 hPa, 30–60°)
  # Required, but declarable N/A for submissions with no dynamical
  # representation of the atmosphere (`score --not-applicable geostrophic_balance`).
  geostrophic_balance:
    tier: I
    requirement: required
    spatial_corr_min: 0.9

  # I.3c Tropical precipitation–buoyancy (P′ vs column-MSE′, 20S–20N)
  precip_buoyancy:
    tier: I
    requirement: required
    rel_tolerance_vs_obs: 0.30         # slope within ±30% of GPCP/ERA5
    # Satellite-era window the observational reference slope is taken over
    # (GPCP starts 1979; never post-2015, which is the reserved test window).
    obs_window: [1979, 2014]
    # Reference slope of P' (mm/day) on column-MSE' (MJ m-2) from GPCP + ERA5
    # over `obs_window`. `PrecipBuoyancyGate` computes it at run time when the
    # observations are obtainable; this key is the stored fallback so a run
    # without network access still gates.
    #
    # DELIBERATELY null (2026-09-20), no longer a TODO. The reference column
    # has to be integrated over the SUBMISSION's own level set, because the
    # observed slope is a strong function of the discretisation: on the staged
    # ERA5 over 20S-20N, 1983-2014, it is 0.14637 mm/day per MJ/m2 (r = 0.42)
    # on ERA5's own 37 levels and 0.03403 (r = 0.11) on CMIP6 plev19. A stored
    # constant can therefore only ever be right for one level set, so it
    # cannot be pinned model-independently; the run-time reference is the
    # right path, and the gate emits `precip_buoyancy_n_levels` so a row can
    # be read without guessing which discretisation produced it.
    # What IS still open for Duncan is the bound above, not this value:
    # see "Decisions needed from Duncan" E.4 in docs/metrics_reference.md.
    reference_slope: null

  # I.4a GFMIP SST patch experiments
  gfmip_patch:
    tier: I
    requirement: extended              # GFMIP patch runs are not part of CMIP6
    delta_lambda_min: 0.5              # W m-2 K-1, λ_EP − λ_WP

  # I.4b amip-4xCO2 effective radiative forcing
  amip_4xco2_erf:
    tier: I
    requirement: required
    range: [6.5, 9.0]                  # W m-2

  # I.5 ENSO (piControl ≥ 100 yr)
  enso:
    tier: I
    requirement: required              # I.5a/b/c
    amplitude_range: [0.5, 1.4]        # K, σ(Niño-3.4)
    band_power_ratio_min: 1.5          # power(2–7 yr) / power(1–2 yr)
    # I.5c: centred, cos-weighted spatial correlation between the modelled
    # and the observed regression of monthly ts / pr anomalies on the
    # standardized Niño-3.4 index over 30S-30N. 0.7 == spatial R2 > 0.5.
    # (Replaces the superseded scalar criterion: the ta500 / Maritime-Continent
    # sign checks and their unwired factor-2 references were dropped 2026-09.)
    teleconnection_pattern_corr_min: 0.7
    # Satellite era the observed patterns are taken over (GPCP starts 1979;
    # never post-2015, which is the reserved Tier II test window).
    teleconnection_obs_window: [1979, 2014]

  # I.5d MJO Wheeler–Kiladis
  mjo:
    tier: I
    requirement: extended              # not every architecture produces daily fields
    east_west_power_ratio_min: 1.5     # k = 1–3, 30–90 day

  # I.6a Land–ocean warming ratio (abrupt-4xCO2, last 50 yr)
  land_ocean_warming:
    tier: I
    requirement: required
    range: [1.2, 1.6]                  # strict pass criterion (paper 2026-09)
    equilibrium_years: 50

  # I.6b Arctic amplification (abrupt-4xCO2, last 50 yr)
  arctic_amplification:
    tier: I
    requirement: required
    ratio_min: 1.5
    lat_min: 66.5
    equilibrium_years: 50

  # I.6c ECS via Gregory regression (150 yr abrupt-4xCO2)
  ecs:
    tier: I
    requirement: required
    range: [1.0, 7.0]                  # K
    n_years: 150

  # I.7 Aerosol forcing (DAMIP hist-aer)
  aerosol_forcing:
    tier: I
    requirement: required              # promoted from Extended, 2026-09
    erf_range: [-2.0, -0.5]            # W m-2, 2015 aerosol ERF
    require_cooling: true              # ΔT(2015) < 0
    # "2015" is the DECADAL MEAN CENTRED ON 2015 (paper App. B.8). Many DAMIP
    # hist-aer runs end in 2014, so the window keeps its length and slides
    # back to the end of the record supplied (physics.clip_window_to_record);
    # the window actually used is emitted with the gate.
    window: [2010, 2019]

  # I.8a Meridional heat transport partitioning (piControl)
  meridional_heat_transport:
    tier: I
    requirement: required
    omet_peak_range: [1.5, 2.0]        # PW
    omet_peak_lat_range: [15, 20]      # °N
    amet_peak_range: [4.0, 5.0]        # PW
    amet_peak_lat: 41                  # °N, observed peak; Duncan 2026-09-21 (was 45 ±5)
    amet_peak_lat_tolerance: 2.5       # → [38.5, 43.5]
    omet_search_band: [5, 30]          # °N band searched for the OMET peak
    amet_search_band: [25, 55]         # °N band searched for the AMET peak

  # I.8b ITCZ–energy flux equator (12-month climatology)
  itcz_efe:
    tier: I
    requirement: required
    slope_reference: 3.0               # ° / PW
    slope_rel_tolerance: 0.30          # ±30% → [2.1, 3.9] (Duncan 2026-09-21: tightened
                                       # from ±50%; CMIP6 slopes span 1.9–3.6, median 2.65)
    corr_min: 0.85                     # Duncan 2026-09-21: loosened from 0.9 (35/58 → 54/58)
    # Months the ITCZ latitude lags the cross-equatorial AMET (Donohoe et al.
    # 2013's seasonal-cycle lag; real-data fix, see physics.itcz_efe_regression).
    # Regressing the two series in phase (0) mixes points from opposite sides
    # of this lag and was the reason itcz_efe_correlation passed 0/58 models.
    itcz_lag_months: 2

  # (extra, code-only — not in the paper's Tier I list as specced, so both are
  # tagged `extra` and excluded from the entry ticket. See the two "(extra,
  # code-only)" sections of metrics_reference.md and delineation-plan §8.5.)
  bjerknes:
    tier: I
    requirement: extra
    corr_max: -0.3                     # decadal AMET-OMET anti-correlation, 40-70N
  cc_scaling:
    tier: I
    requirement: extra
    slope_range: [5.0, 9.0]            # % / K (Held & Soden 2006: 7 ± 2)

tier2:
  # Start of the reserved post-2015 test window (paper Tier II scope). The CLI
  # derives its default Tier II timerange from this (`20150101/<last complete
  # year>1231`); the scoring layer uses it as the first scored year.
  test_window_start: 2015
  # First year of the long ("1950-present") trend window of §II.1, used for the
  # second internal-variability window length of the consistency test.
  long_trend_start: 1950
  # Pre-test baseline: 1985–2014 (NOT 1990–2020, which overlapped the reserved
  # post-2015 test window). Used by the Climatology baseline row, as the
  # Pinatubo reference climatology, and as the reference's PRE-2015 record for
  # the regime-(b) EOF basis and its standardisation.
  climatology_baseline_period: [1985, 2014]
  # A reference whose record covers fewer than this many years of the baseline
  # window is skipped (with a logged reason) rather than half-sampled.
  climatology_baseline_min_years: 10

  # The CMIP6 comparison ensemble behind E_ref (paper §5.6 and the Fig. 4
  # caption: "Each model's ensemble comprises its r*i1p1f* members, capped at
  # the first 10"; ratified by Duncan 2026-09-20). Applied by
  # `data.cmip6_staged.select_members` inside the generator, so any data root
  # yields the same ensemble: members matching `member_pattern` (each index a
  # number or `*`), ordered by realization number, the first
  # `max_members_per_model` per model. The cap is taken per MODEL before any
  # variable is looked at, so a variable some of those members lack is scored
  # on fewer of them, never on later members that happen to carry it.
  comparison_ensemble:
    member_pattern: "r*i1p1f*"
    max_members_per_model: 10

  # REGIME (a) IS SCORED ON ANOMALIES (paper §scoring; metrics_reference.md
  # "(a) Time-resolved quantities"). Every scored time series — the
  # submission's members, the reference and every comparison member — is first
  # reduced to an anomaly about ITS OWN climatology over
  # `climatology_baseline_period`, per `data_id` (i.e. per ensemble member),
  # and only then cut to `test_window_start`-present for scoring. Without this
  # the fair CRPS is dominated by each field's mean-state bias rather than by
  # the forced trajectory + internal variability the protocol asks about (on
  # real data CNRM-CM6-1's 1.1 K cold absolute GMST bias alone gave
  # CRPS ~ 1.0 K and skill -2.85 with a perfectly good post-2015 trajectory).
  #
  # Which suite entries this applies to is protocol metadata, exactly like
  # `window_labels` below, and is keyed the same way (the suite entry name =
  # the DuckDB schema the rows land in). It drives BOTH halves of the
  # mechanism: `reference_windows.apply_reference_windows` gives a listed
  # entry the baseline-extended load window, and `scoring_pass` anomalises
  # its series. `default` is false so Tier I, `ClimateBench2_TierII_daily`
  # (whose annual block maxima are in-sample over the full record) and any
  # user suite keep absolute values.
  anomaly_baseline:
    default: false
    diagnostics:
      annual_mean_timeseries: true
      sst: true
      ohc: true
      sea_ice_minimum: true
      # The daily suite's one HELD-OUT entry (2026-09-21): the annual
      # regional-mean Rx1day/Rx5day series, scored over the test window
      # against IMERG. Listing it here does two things at once, which is the
      # point of one predicate (`windows.scores_anomalies`) driving both
      # halves: the scoring pass anomalises the series per data_id, and
      # `reference_windows` exempts it from the pre-test cap the suite's
      # other IMERG-referenced entries get (it needs the 1985-2014 baseline
      # AND the post-2015 steps, i.e. the whole record).
      #
      # Feasible because IMERG covers 2001-2014 = 14 baseline years, above
      # the `min_years: 10` floor below. It is the thinnest baseline of any
      # scored entry: 14 years, not 30. Duncan, decision B.29 -- if 10 rises
      # to 20 this entry goes unscored with a `reason` row.
      pr_extremes_series: true
    # A source covering fewer than this many distinct years of the baseline
    # window is NOT scored: it gets a `reason` row, never a silent fall back
    # to absolute values. ⚠ TODO(Duncan): 10 matches
    # `climatology_baseline_min_years` above. 20 would be the stricter,
    # more conventional climatological minimum, but CERES-EBAF starts
    # 2000-03 and MODIS 2002-07, so 20 would leave rsut/rlut/rtnt/rsutcs/
    # rlutcs/swcre/lwcre (baseline 2001-2014) and clt/clwvi/clivi (2003-2014)
    # — ten of the paper's fourteen figure variables — unscored.
    min_years: 10
  # Regime (a): fair (Ferro) CRPS with effective-sample-size correction on the
  # reported uncertainty. Fair CRPS is undefined for a deterministic forecast,
  # so a single-member model is reported as "n/a (single member)", never as
  # the absolute error.
  crps_ess_correction: true
  # Moving-block bootstrap of the time-mean fair CRPS (scoring_pass).
  bootstrap:
    block_length_monthly: 12           # steps (1 yr) for a monthly series
    block_length_annual: 3             # steps (3 yr) for an annual series
    n_boot: 1000                       # bootstrap replicates
    alpha: 0.05                        # -> 95% percentile interval
    resample_members: true             # also resample ensemble members
    seed: 20260914                     # fixed: every model gets the same resamples
  # Observational-uncertainty draws: fair CRPS averaged over K pseudo-
  # observations y_k ~ N(obs, sigma_obs), the SAME draws for a submission and
  # its baselines.
  obs_uncertainty:
    n_draws: 100
    seed: 20260914
  # sigma_obs of the SCORED series (the area-mean value at one time step), in
  # the variable's own units. ClimateEval exposes no observational error field
  # for any of its DataSources (HadCRUT5 CMORizes `tas`/`tasa` only, with no
  # ensemble or uncertainty variable), so these are fixed protocol constants
  # rather than a plumbed-through field. Keys are matched against the suite
  # variable id first, then the token before its first underscore, then
  # `default`; `null` means "unknown" and scores at sigma_obs = 0.
  #
  # ⚠ PROVISIONAL — every non-null value below needs Duncan's ruling.
  # Where a variable has several observational products in the suite
  # (reference + `other_data` with an observation/reanalysis category), the
  # per-time-step spread ACROSS products is added in quadrature to the value
  # here; that inter-product term is measured, this one is the floor.
  obs_sigma:
    default: null
    tas: 0.05                          # K; HadCRUT5 annual global-mean 1-sigma
    ts: 0.05                           # K; as tas
    tos: 0.05                          # K; SST products, TODO(Duncan)
    pr: null                           # TODO(Duncan): GPCP global-mean 1-sigma
    rsut: 0.20                         # W m-2; CERES-EBAF stability, TODO(Duncan)
    rlut: 0.20                         # W m-2; as rsut
    rtnt: 0.20                         # W m-2; as rsut
    rsutcs: 0.20                       # W m-2; as rsut
    rlutcs: 0.20                       # W m-2; as rsut
    swcre: 0.20                        # W m-2; CERES-EBAF rsutcs - rsut, as rsut
    lwcre: 0.20                        # W m-2; CERES-EBAF rlutcs - rlut, as rsut
    clt: null                          # TODO(Duncan): MODIS global-mean 1-sigma (%)
    clwvi: null                        # TODO(Duncan): MODIS, kg m-2
    clivi: null                        # TODO(Duncan): MODIS, kg m-2
    # Aggregated scalars (gmst_*, pinatubo_*, nh_minus_sh_*) carry their own
    # sigma_obs as a `<scalar>_sigma_obs` companion column emitted by the
    # diagnostic (the blending term below), so they stay `null` here — an
    # unknown floor, added in quadrature to the emitted term.

  # Realized warming level, the two GMST trends, the Pinatubo response and the
  # hemispheric asymmetry are AGGREGATED SCALARS: one number per ensemble
  # member, scored by the pass with fair CRPS against the observed value and
  # with the regime-(c) consistency test (metrics_reference.md §II.1).
  warming_level:
    tier: II
    requirement: diagnostic            # reported numbers, never a gate row

  # GSAT BLENDING CORRECTION (paper §II.1, new 2026-09). HadCRUT5/GISTEMP/
  # Berkeley blend land 2 m air temperature with sea surface temperature,
  # whereas a model's `tas` is surface air temperature throughout. The
  # protocol corrects the OBSERVATIONS to a SAT basis rather than building
  # blended, coverage-masked model fields (which would need `tos`/`siconc`
  # that not every architecture produces). CB2 applies the factor to the
  # observed ANOMALIES (relative to climatology_baseline_period), so it
  # scales warming levels and trends alike and leaves absolute levels alone.
  # ⚠ PROVISIONAL — TODO(Duncan): 1.09 is the ~9% more warming SAT shows than
  # a blended product (Cowtan et al. 2015; Richardson et al. 2016). Pin the
  # protocol's own number.
  gsat_blending_factor: 1.09
  # The paper assesses the correction uncertainty at "at most 10% of the
  # long-term change, with low confidence in its sign", carried in the
  # observational variance term. CB2 reads "the long-term change" as the
  # magnitude of the corrected statistic itself and adds
  # `rel * |value|` in quadrature to the row's sigma_obs (⚠ CB2 reading).
  gsat_blending_relative_uncertainty: 0.10

  # Which sigma_int an aggregated scalar's regime-(c) consistency test uses:
  # the InternalVariability rows are keyed by (variable, statistic) and
  # reported at two window lengths (`test` = the reserved post-2015 window,
  # `long` = tier2.long_trend_start-present), so each scalar names the triple
  # that matches the record it is computed over.
  scalar_consistency:
    gmst_warming_level: {variable: tas, statistic: mean, window: test}
    gmst_trend_test_window: {variable: tas, statistic: trend, window: test}
    gmst_trend_1950: {variable: tas, statistic: trend, window: long}
    # Jul 1991 - Dec 1993 is ~2.5 yr, far shorter than either reported
    # window; the `test` mean sigma_int is the nearer of the two and is
    # therefore an UNDER-estimate of the interannual spread of a 2.5-yr mean
    # (a conservative, i.e. stricter, consistency test).
    pinatubo_tas_anom: {variable: tas, statistic: mean, window: test}
    # The aerosol era (1950-1985, 36 yr) is closest to the `long` window.
    nh_minus_sh_trend: {variable: tas, statistic: trend, window: long}

  # HELD-OUT vs IN-SAMPLE labelling (paper §5.6: the scorecard states, per
  # entry, whether the observations were available before the reserved test
  # period). The scoring pass writes a `window` column on EVERY row it
  # writes; a `var_ids` entry wins over a `diagnostics` entry (the suite entry
  # name, i.e. the DuckDB schema), and anything unlisted takes `default`.
  # A `<var>_trend_consistency` / `<var>_consistency` row inherits the label
  # of the variable it tests.
  window_labels:
    default: held-out
    diagnostics:
      # Scored over the reserved post-2015 test window
      annual_mean_timeseries: held-out
      sst: held-out
      ohc: held-out
      sea_ice_minimum: held-out
      eof_projection: held-out
      sst_eof_projection: held-out
      realized_warming_level: held-out
      # Climatologies and event diagnostics over the historical record
      annual_cycle: in-sample
      map: in-sample
      zonal_line: in-sample
      sea_ice_annual_cycle: in-sample
      tas_annual_max: in-sample
      pr_intensity_pdf: in-sample
      pr_diurnal_cycle: in-sample
      # The daily suite's climatologies are computed over the historical
      # record (work package 6b), so they are in-sample. `extremes` scores
      # its PRECIPITATION indices against IMERG over 2001-2014 (the
      # reference's record clipped before the test window); its tasmax/tasmin
      # indices still have no reference and so write no scored row at all,
      # and the label waits for HadEX3 to be staged. `perkins` writes metrics
      # rather than pass rows, so its label is the leaderboard's.
      extremes: in-sample
      diurnal_harmonic: in-sample
      perkins: in-sample
      # ... and the one exception in that suite: the annual Rx1day/Rx5day
      # series is scored over the reserved post-2015 window against IMERG,
      # so it is HELD-OUT. It is also the only daily entry in
      # `anomaly_baseline` above, which is what keeps it on the full record
      # while its in-sample neighbours are capped at 2014.
      pr_extremes_series: held-out
      pinatubo: in-sample
      hemispheric_asymmetry: in-sample
      # Seasonal-cycle metrics: properties of the 1985-2014 climatology
      land_temperature_range: in-sample
      sst_low_cloud_covariance: in-sample
      seasonal_cloud_feedback: in-sample
    var_ids:
      gmst_warming_level: held-out
      gmst_trend_test_window: held-out
      gmst_trend_1950: in-sample     # 1950-present spans the historical record
      pinatubo_tas_anom: in-sample
      pinatubo_rsds_anom: in-sample
      nh_minus_sh_trend: in-sample
      itcz_shift_deg_per_decade: in-sample
  # Regime (c): ensemble-consistency test
  consistency_p_value: 0.05            # two-sided
  eof_modes: 5                         # spatial fields: leading EOFs tested
  # Regime (b): fair CRPS on the reference's FIXED pre-2015 EOF basis. The
  # basis is truncated by a pre-registered variance-explained criterion (the
  # protocol fixes it once, in advance, so it cannot be tuned per submission).
  eof:
    variance_explained: 0.9            # keep the leading modes reaching 90%
    max_modes: 20                      # hard cap on the retained modes
    min_modes: 1
  # Internal variability sigma_int for the consistency test: the piControl
  # global-mean annual series chunked into observation-length segments
  # (scoring.chunked_statistic_std) for the window MEAN and the OLS TREND.
  internal_variability:
    tier: II
    requirement: diagnostic            # a reported input, never a gate
    variables: [tas, pr, rsut, rlut, tos, prw, clt]
    min_chunks: 2                      # fewer -> no sigma_int for that window
  # Pinatubo response (1991-07 .. 1993-12 vs the climatology_baseline_period
  # climatology above, i.e. 1985–2014)
  pinatubo:
    tier: II
    requirement: diagnostic            # Tier II aggregated diagnostic, not a gate
    rsds_anomaly_max: 0.0              # dimming: global-mean anomaly < 0
    tas_anomaly_max: 0.0               # cooling: global-mean anomaly < 0
  # Aerosol-era hemispheric asymmetry
  hemispheric_asymmetry:
    tier: II
    requirement: diagnostic            # Tier II aggregated diagnostic, not a gate
    era: [1950, 1985]                  # the aerosol era the trends are taken over
    nh_minus_sh_trend_max: 0.0         # NH warming suppressed vs SH
    itcz_shift_max: 0.0                # southward ITCZ migration (°/decade)
  # Two-layer EBM parameters for the pattern-scaling baseline (Geoffroy 2013
  # multi-model means; recalibrate when the protocol fixes them)
  ebm:
    lambda_feedback: -1.3              # W m-2 K-1
    c_upper: 8.0                       # W yr m-2 K-1
    c_deep: 100.0                      # W yr m-2 K-1
    gamma: 0.7                         # W m-2 K-1
    efficacy: 1.3

  # Pattern-scaling baseline (metrics_reference.md Tier II "Baselines" (iii)):
  # a two-layer EBM driven by an annual ERF series and calibrated to the
  # observed GMST THROUGH 2014 (never into the reserved test window), times a
  # normalized CMIP6 multi-model-mean warming pattern for regional fields.
  pattern_scaling:
    tier: II
    requirement: diagnostic            # a reported reference, never a gate
    # Packaged annual ERF table (climatebench2/data/). Its header carries the
    # provenance and a prominent TODO(Duncan): it is currently a linear
    # interpolation of published AR6 anchor values with NO natural forcing,
    # not the AR6 annual series itself.
    erf_file: erf_ar6_ssp245.csv
    # Exactly ONE parameter is fitted, so the emulator stays the simplest
    # defensible reference: the feedback (`lambda_feedback`) or a scaling of
    # the forcing (`forcing_scale`).
    calibrated_parameter: lambda_feedback
    lambda_bounds: [-3.0, -0.3]        # W m-2 K-1, the search interval
    calibration_end_year: 2014         # the paper's "through 2014"
    # Variables the GMST trajectory is a forecast OF. A two-layer EBM
    # predicts a global-mean surface temperature anomaly and nothing else, so
    # the baseline row is written for these series only (matched as the suite
    # variable id, then the token before its first underscore) — never for
    # precipitation, fluxes or sea ice, where it would be meaningless.
    variables: [tas, ts, tos]
    # Fewer observed years than this before `calibration_end_year` and the
    # baseline is not fitted at all: a `reason` row says so instead.
    min_calibration_years: 10

  # --- Work package 6b: the daily, seasonal and diurnal Tier II statistics --

  # Daily ETCCDI extremes (§II.1 "Daily tas extremes / pr intensity PDF").
  # In-sample: computed over the FULL historical record, not the test window.
  extremes:
    tier: II
    requirement: diagnostic            # reported scalars, never a gate row
    # "conservative regridding of model and obs to a common ~1 degree grid"
    # (paper §5.2). ESMValCore grid spec + scheme.
    grid: 1x1
    regrid_scheme: area_weighted
    # Fixed base period for the percentile thresholds of TX90p / WSDI /
    # R95pTOT. The same window as every other Tier II baseline.
    base_period: [1985, 2014]
    warm_day_percentile: 90            # TX90p, WSDI threshold
    wet_day_percentile: 95             # R95pTOT threshold (wet days only)
    wsdi_min_spell_days: 6             # a warm spell is >= 6 consecutive days
    wet_day_threshold: 1.0             # mm day-1, a "wet day"
    dry_day_threshold: 1.0             # mm day-1, CDD counts days below this
    # ETCCDI indices are LAND indices (they were defined on station data), so
    # the field is land-masked once and the regions below are latitude bands
    # of that land.
    # AR6 region masks would be the natural refinement (ESMValCore
    # `extract_shape` via `Variable.ar6_regions_mask`, which ClimateEval
    # already supports) but need the AR6 shapefile at run time; CB2 starts
    # with bands. TODO(Duncan): pick the AR6 land regions to report.
    regions:
      global_land: [-90, 90]
      tropical_land: [-30, 30]
      nh_extratropical_land: [30, 90]
      sh_extratropical_land: [-90, -30]

  # Perkins skill score on daily PDFs (§II.1). Pre-registered bins: fixed in
  # advance so the statistic cannot be tuned per submission.
  perkins:
    tier: II
    requirement: diagnostic
    wet_day_threshold: 1.0             # mm day-1, the pr PDF is wet days only
    # Daily `tas` anomalies are taken against the fixed base-period daily
    # climatology rather than a 30-yr running one.
    # TODO(Duncan): the paper says "a moving climatological baseline"; CB2
    # uses the fixed `extremes.base_period` per calendar month as an explicit
    # simplification (metrics_reference.md §II.1).
    bins:
      tas_anomaly: {range: [-20.0, 20.0], width: 0.5}   # K
      pr_intensity: {range: [1.0, 101.0], width: 2.0}   # mm day-1, wet days
    # The score is pooled by season here and by REGION in the suite: a
    # latitude band and a land mask are both `Variable` properties
    # ClimateEval already applies, so each region is its own suite variable
    # (`tas_anomaly_land`, `pr_intensity_tropics`, …) rather than a list here.
    seasons: [DJF, MAM, JJA, SON]

  # Diurnal cycle (§II.1, Extended): first-harmonic amplitude and phase of the
  # sub-daily climatology in LOCAL SOLAR TIME.
  diurnal:
    tier: II
    requirement: diagnostic
    # ClimateEval's common grid: the local-solar-time shift is a whole-column
    # roll, so the resolution only has to resolve the longitudinal structure.
    grid: 2x2
    seasons: [DJF, JJA]
    # Latitude bands only: the land/sea split that makes this diagnostic
    # interesting (models rain at local noon over land, observations in the
    # late afternoon) is a MASK, which ClimateEval owns — the suite declares
    # it per variable with `landsea_mask: land_only` / `sea_only`.
    regions:
      tropics: [-30, 30]

  # Seasonal-cycle metrics (§II.1 "Seasonal-cycle metrics").
  seasonal:
    tier: II
    requirement: diagnostic
    # (i) land annual temperature range: max - min of the 12-month `tas`
    # climatology, area-averaged over land.
    # (ii)/(iii) stratocumulus decks for the SST-low-cloud covariance and the
    # seasonal cloud-radiative feedback. Longitudes may be negative: cubes are
    # on 0-360 but `extract_region` goes through `iris.Cube.intersection`,
    # which is modular, so a box straddling the Greenwich meridian (Namibian)
    # needs no special case.
    # TODO(Duncan): confirm the five boxes; these are the conventional
    # Klein & Hartmann (1993) / Wood (2012) decks.
    stratocumulus_regions:
      californian: {lat: [15, 35], lon: [-140, -110]}
      peruvian: {lat: [-30, -10], lon: [-100, -70]}
      namibian: {lat: [-30, -5], lon: [-20, 10]}
      canarian: {lat: [10, 30], lon: [-45, -15]}
      australian: {lat: [-40, -20], lon: [90, 115]}

tier3:
  # ---- III.1 paleo time slices -------------------------------------------
  # Pseudo-members for a single-member equilibrium experiment (paper §5.1):
  # the climatological anomaly (block mean minus the FULL piControl mean) of
  # each non-overlapping block of the EQUILIBRATED portion of the paleo run.
  # `spinup_years` is that equilibration allowance, dropped from the head of
  # the record; `block_years` is the block length, which is also the length
  # of the climatology being scored. M = (n_years - spinup) // block_years,
  # so at least 2*block_years + spinup_years of output are needed before fair
  # CRPS is defined at all — otherwise the diagnostic writes a `reason` row.
  # TODO(Duncan): both are CB2 defaults, not paper values. 30 yr matches the
  # conventional PMIP4 climatology; 100 yr of spin-up is the usual PMIP4
  # equilibration allowance for a run branched from an equilibrated control.
  block_years: 30
  spinup_years: 100
  min_pseudo_members: 2                # fair CRPS is undefined below this
  # Where `paleo_scripts/process_paleo_observations.py` writes its per-dataset
  # NetCDFs. Relative paths resolve against the working directory; override
  # per run with `climatebench2 score --paleo-data-root DIR`.
  paleo_data_root: paleo_scripts/paleo_data_cache/processed/observations
  # Proxy networks are point measurements, not an area sample, so the
  # variable-level score is the EQUAL-WEIGHT mean over sites (cos-latitude
  # weighting would weight grid cells, not cores). Recorded here so the
  # choice is a protocol constant rather than an implementation detail.
  site_weighting: equal
  # Paper App. D (2026-09) scores the RAW proxy compilations only. Products
  # whose `dataset_type` attribute is not listed here are still computed and
  # reported — tagged with their type — but excluded from the protocol score.
  scored_dataset_types: [proxy_compilation]
  # Comparisons are climatological anomalies of the annual mean unless a
  # dataset's variable is explicitly seasonal (Bartlein MTCO/MTWA, not
  # processed today); `seasonality` is then a per-stanza kwarg.
  seasonality: annual
  # mid-Holocene North-Africa monsoon check
  midholocene_monsoon:
    tier: III
    requirement: extended              # mid-Holocene is Extended (paper 2026-09)
    jjas_pr_anom_min: 0.5              # mm day-1 vs piControl
    region: {lat: [10, 30], lon: [-20, 30]}
  # ---- III.2 perfect model ------------------------------------------------
  # Large-ensemble spread test against the truth model's own ensemble.
  # TODO Phase 5 / TODO(Duncan): settle the bound — [0.5, 2.0] is provisional
  # and has never been exercised against CESM-LE.
  le_spread:
    tier: III
    requirement: extended
    variance_ratio_range: [0.5, 2.0]
    # Variables the spread test is run for when truth members are present.
    variables: [tas, pr]
