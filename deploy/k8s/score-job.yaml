# Score one submission: a Kubernetes Job running the cb2-run entrypoint.
#
# Fill in the values marked <...> (or use deploy/submit.sh, which does it from
# the command line) and apply. <MODEL_URI> is normally the submission's
# directory in the private bucket, gs://climatebench-submissions/<model>/
# (read with the HMAC key below); an s3:// URI (read with the service
# account's IRSA role) or a path inside the pod also works.
#   kubectl -n climatebench create -f score-job.yaml
#
# Sizing: references (~34 GB), the frozen comparison bundle (<0.1 GB) and the
# submission are copied to the pod's ephemeral volume. A 10-member submission
# with Tier I experiments is typically 100-300 GB of NetCDF; the daily
# precipitation suite holds each member's daily `pr` in memory one at a time.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: cb2-score-
  namespace: climatebench
  labels:
    app.kubernetes.io/name: climatebench2
    climatebench2/model: <MODEL_NAME>
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: climatebench2
    spec:
      serviceAccountName: cb2-scorer
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: score
          image: ghcr.io/climate-federation/climatebench2:<IMAGE_TAG>
          args:
            - python
            - /opt/cb2/cb2_run.py
            - --model-uri=<MODEL_URI>
            - --name=<MODEL_NAME>
            - --profile=v2
            # Results go to the profile's results_uri
            # (gs://climatebench/v2/results/<name>/<timestamp>/) unless
            # overridden with --output-uri.
          env:
            - name: CB2_IMAGE
              value: ghcr.io/climate-federation/climatebench2:<IMAGE_TAG>
            - name: DASK_NUM_WORKERS
              value: "8"
            # HMAC key of the GCP service account cb2-scorer (objectViewer on
            # gs://climatebench-submissions, objectCreator on
            # gs://climatebench/v2/results/). One key serves both reading the
            # submission and writing the results; the public bundles are read
            # anonymously. (kubectl -n climatebench create secret generic
            # cb2-gcs-hmac --from-literal=access_id=... --from-literal=secret=...)
            - name: GCS_HMAC_ACCESS_ID
              valueFrom:
                secretKeyRef: {name: cb2-gcs-hmac, key: access_id}
            - name: GCS_HMAC_SECRET
              valueFrom:
                secretKeyRef: {name: cb2-gcs-hmac, key: secret}
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              ephemeral-storage: 400Gi
            limits:
              memory: 120Gi
              ephemeral-storage: 600Gi
          volumeMounts:
            - name: scratch
              mountPath: /scratch
      volumes:
        # Generic ephemeral volume: a fresh gp3 EBS volume per pod, deleted
        # with it. Swap for an emptyDir on instance-store NVMe nodes.
        - name: scratch
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                storageClassName: gp3
                resources:
                  requests:
                    storage: 600Gi
