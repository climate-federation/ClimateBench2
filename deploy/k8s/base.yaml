# One-off cluster setup for ClimateBench v2 scoring on EKS.
#
# The service account is bound to an IAM role (IRSA) that may READ the
# submission bucket on S3. The reference and comparison bundles are read
# anonymously from gs://climatebench; results are written there with the GCS
# HMAC key in the `cb2-gcs-hmac` Secret (see score-job.yaml). Replace the
# placeholders before applying:
#   <ACCOUNT_ID>, <ROLE_NAME>
#
#   kubectl apply -f deploy/k8s/base.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: climatebench
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cb2-scorer
  namespace: climatebench
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/<ROLE_NAME>
